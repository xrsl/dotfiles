format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$golang\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "yellow"

[python]
symbol = " "
format = "[$symbol$virtualenv]($style) "

[nodejs]
symbol = " "

[golang]
symbol = " "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
