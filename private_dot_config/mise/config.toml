# Pin Node to the current LTS. This takes Node out of Homebrew's hands (was v26,
# a bleeding-edge line) so `brew upgrade` can never break your global CLI tools.
node = "lts"
"npm:9router" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
