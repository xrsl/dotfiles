"aqua:helm/helm" = "latest"
"aqua:jesseduffield/lazygit" = "latest"
"aqua:jqlang/jq" = "latest"
"aqua:junegunn/fzf" = "latest"
"aqua:kubernetes/minikube" = "latest"
# Colima needs limactl; Homebrew previously supplied this dependency implicitly.
"aqua:lima-vm/lima" = "latest"
"aqua:mikefarah/yq" = "latest"
"aqua:ogulcancelik/herdr" = "latest"
"aqua:rhysd/actionlint" = "latest"
"aqua:sharkdp/bat" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:starship/starship" = "latest"
"aqua:sxyazi/yazi" = "latest"
"aqua:tombi-toml/tombi" = "latest"
"aqua:typst/typst" = "latest"
"aqua:watchexec/watchexec" = "latest"
"aqua:yorukot/superfile" = "latest"
"aqua:zellij-org/zellij" = "latest"
"asdf:mise-plugins/mise-eza" = "latest"
bun = "latest"
# cargo:* tools compile from source — they need the Rust toolchain (see `rust` below).
"cargo:firesym" = "latest"
"cargo:just-lsp" = "latest"
"cargo:serpl" = "latest"
# CLI for Git worktree management.
worktrunk = "latest"
chezmoi = "latest"
colima = "latest"
dagger = "latest"
go = "latest"
# Nilaway has no release tags; use a reproducible Go pseudo-version.
"go:go.uber.org/nilaway/cmd/nilaway" = "v0.0.0-20260717202641-aacdd5a364bf"
# The leading v avoids mise's nested-module fallback to the invalid 0.23.0 tag.
"go:golang.org/x/tools/gopls" = "v0.23.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"github:jnsahaj/lumen" = "latest"
"github:lusingander/serie" = "latest"
"github:nushell/nushell" = { version = "latest", exe = "nu" }
"github:sinelaw/fresh" = "latest"

# Pin Node to the current LTS. This takes Node out of Homebrew's hands (was v26,
# a bleeding-edge line) so `brew upgrade` can never break your global CLI tools.
node = "lts"
"npm:9router" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@github/copilot" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@kilocode/cli" = "latest"
"npm:@marp-team/marp-cli" = "latest"
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:@robzolkos/lazypi" = "latest"
"npm:@z_ai/coding-helper" = "latest"
"npm:cline" = "latest"
"npm:cspell" = "latest"
"npm:firecrawl-mcp" = "latest"
"npm:hunkdiff" = "latest"
"npm:kanban" = "latest"
"npm:openskills" = "latest"
"npm:pnpm" = "latest"
"npm:postman-cli" = "latest"
"npm:slop-scan" = "latest"
"npm:tokscale" = "latest"
python = "3.12"
# Rust toolchain — mise's `core:rust` does NOT install a standalone Rust; it installs
# rustup if absent and drives toolchains through it (standard ~/.rustup and ~/.cargo;
# override with MISE_RUSTUP_HOME / MISE_CARGO_HOME to isolate). rustup stays the real
# manager (components, targets, nightly); this line only declares Rust so `mise install`
# provisions it reproducibly and can build the cargo:* tools above.
# Docs: https://mise.jdx.dev/lang/rust.html
rust = "latest"

[settings]
# In project dirs, honor an existing .nvmrc / .node-version so repos still pin themselves.
idiomatic_version_file_enable_tools = ["node"]
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64"]
