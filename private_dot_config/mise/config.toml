# Rust toolchain — mise's `core:rust` does NOT install a standalone Rust; it installs
# rustup if absent and drives toolchains through it (standard ~/.rustup and ~/.cargo;
# override with MISE_RUSTUP_HOME / MISE_CARGO_HOME to isolate). rustup stays the real
# manager (components, targets, nightly); this line only declares Rust so `mise install`
