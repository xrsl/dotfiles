[env]
# Hand uv the mise-managed interpreter, otherwise uv downloads a second Python of its own and every .venv breaks the moment mise's rolls forward.
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
idiomatic_version_file_enable_tools = ["node", "python"]
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64", "linux-arm64"]
minimum_release_age = "0d"

[settings.github]
use_git_credentials = true

[tasks.gh-auth]
description = "Log in to GitHub so git works over HTTPS (disposable-VM friendly; no SSH keys)"
run = """
set -e
gh config set git_protocol https
if gh auth status --hostname github.com >/dev/null 2>&1; then
  echo 'Already authenticated:'
  gh auth status --hostname github.com
else
  gh auth login --hostname github.com --git-protocol https --web
fi
echo
echo 'Done. git now uses gh over HTTPS. Test: git ls-remote https://github.com/xrsl/dotfiles'
"""
