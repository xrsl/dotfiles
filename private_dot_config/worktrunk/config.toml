skip-commit-generation-prompt = true

[aliases]
# switch/list/remove — cd from switch & remove propagates via shell integration.
new = "git fetch -q origin {{ args[0] }} 2>/dev/null; git fetch -q origin {{ default_branch }} || true; if git show-ref --verify --quiet refs/remotes/origin/{{ args[0] }}; then wt switch {{ args[0] }}; else wt switch --create {{ args[0] }} --base {{ args[1] | default('origin/' ~ default_branch) }}; fi"
s = "wt switch {{ args }}"
l = "wt list {{ args }}"
rm = "wt remove -D {{ args }}"
m = "wt merge {{ args }}"
# COMMIT — `wt sc<suffix>` picks the LLM backend; suffixes mirror the agent
# shortcuts in ~/.zshrc (cx=codex, oc=opencode, co=copilot, pi=pi).
# Each pipes worktrunk's prompt (incl. the Conventional rule) to that backend.
# `wt sc` = default (claude, from [commit.generation]) + editor fallback.
sc = "wt step commit {{ args }} || git commit"
sc-cx = "git add -A && wt step commit --show-prompt | codex exec -m gpt-5.1-codex-mini -c model_reasoning_effort='low' -c system_prompt='' --sandbox=read-only --json - | jq -sr '[.[] | select(.item.type? == \"agent_message\")] | last.item.text' | git commit -F -"
sc-oc = "git add -A && wt step commit --show-prompt | opencode run -m anthropic/claude-haiku-4.5 --variant fast | git commit -F -"
# experimental: copilot & pi take the prompt as an arg and may add chatter —
# review the message before pushing. pi model matches your `pq` alias.
sc-co = "git add -A && copilot --output-format text -p \"$(wt step commit --show-prompt)\" | git commit -F -"
sc-pi = "git add -A && pi --print --no-prompt-templates --model qwen3.5:35b-a3b-coding-nvfp4 \"$(wt step commit --show-prompt)\" | git commit -F -"

# SHIP — commit (chosen backend) → push → open PR. `wt pr` = claude default,
# and only commits if the tree is dirty; the pr-<x> variants assume you have
# changes to commit. Conventional prefix comes from template-append below.
pr = "{ git diff --quiet && git diff --cached --quiet || wt step commit || git commit; } && git push -u origin HEAD && gh pr create --fill {{ args }}"
pr-cx = "git add -A && wt step commit --show-prompt | codex exec -m gpt-5.1-codex-mini -c model_reasoning_effort='low' -c system_prompt='' --sandbox=read-only --json - | jq -sr '[.[] | select(.item.type? == \"agent_message\")] | last.item.text' | git commit -F - && git push -u origin HEAD && gh pr create --fill {{ args }}"
pr-oc = "git add -A && wt step commit --show-prompt | opencode run -m anthropic/claude-haiku-4.5 --variant fast | git commit -F - && git push -u origin HEAD && gh pr create --fill {{ args }}"
pr-co = "git add -A && copilot --output-format text -p \"$(wt step commit --show-prompt)\" | git commit -F - && git push -u origin HEAD && gh pr create --fill {{ args }}"
pr-pi = "git add -A && pi --print --no-prompt-templates --model qwen3.5:35b-a3b-coding-nvfp4 \"$(wt step commit --show-prompt)\" | git commit -F - && git push -u origin HEAD && gh pr create --fill {{ args }}"

# LAND — full lifecycle from a worktree: commit (claude) → sync main → push →
# open PR (if absent) → wait for CI → squash-merge → remove this worktree.
# Blocks until CI passes; if CI fails it stops before merging and keeps the
# worktree so you can fix. Run from inside the feature worktree.
# Idempotent: every step is a no-op when already done, so a half-finished land
# (e.g. merge blocked by an out-of-date branch) recovers cleanly on re-run.
#   - merges origin/main in first, so branch protection's "up to date" passes
#   - skips PR creation if one already exists (gh pr create would error)
#   - treats an already-MERGED PR as merge success, so cleanup still runs
land = "{ git diff --quiet && git diff --cached --quiet || wt step commit || git commit; } && git fetch -q origin {{ default_branch }} && git merge --no-edit origin/{{ default_branch }} && git push -u origin HEAD && { gh pr view --json number >/dev/null 2>&1 || gh pr create --fill {{ args }}; } && sleep 8 && gh pr checks --watch --interval 10 && { gh merge || gh pr view --json state -q .state | grep -qx MERGED; } && { git fetch -q origin {{ default_branch }} || true; } && wt remove -D"

# DEV LOOP — small, fast helpers for day-to-day work in a feature worktree.
# UP — rebase the current branch onto a freshly fetched origin/main; keeps a long-lived feature branch current without leaving the worktree (pairs with new/ship tracking origin/main).
up = "git fetch -q origin {{ default_branch }} && git rebase origin/{{ default_branch }}"
# HOME — jump to the main worktree and fast-forward local main; this is the `git pull` ship leaves out (ship merges via gh merge on the remote, so local main drifts until pulled here).
home = "wt switch ^ && git -C {{ repo_path }} pull --ff-only -q"
# WIP — instant checkpoint commit: stage everything, skip LLM/hooks, no wait; unwind before a real commit with `git reset --soft HEAD~1`.
wip = "git add -A && git commit -m wip --no-verify"
# REV — spin up a throwaway worktree to review a PR (`wt rev 123`); tear it down afterwards with `wt rm <branch>`.
rev = "wt switch pr:{{ args }}"
# DRAFT — same flow as pr but opens a draft PR: commit (if dirty) → push → open draft; good for early CI signal without pinging reviewers.
draft = "{ git diff --quiet && git diff --cached --quiet || wt step commit || git commit; } && git push -u origin HEAD && gh pr create --fill --draft {{ args }}"

# LLM one-line branch summaries in `wt list --full` and the switch picker.
# Uses the [commit.generation] command below; cached, regenerated on diff change.
[list]
summary = true

[commit.generation]
# Generate commit messages with Claude Code (haiku, text-only, fast).
command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

# Append the Conventional Commits rule to worktrunk's default prompt (keeps its
# diff/style handling). Drives the PR title prefix the GitHub auto-labeler reads.
template-append = """
- Use Conventional Commits: <type>(<optional scope>): <subject>
- type is one of: feat, fix, docs, chore, refactor, perf, test, ci, build, style
- subject: imperative mood, lower-case, no trailing period, <= 60 chars
"""

[projects]
# # User Configuration
#
# Create with `wt config create`. Values shown are defaults unless noted otherwise.
#
# Location:
#
# - macOS/Linux: `~/.config/worktrunk/config.toml` (or `$XDG_CONFIG_HOME` if set)
# - Windows: `%APPDATA%\worktrunk\config.toml`
#
# ## Worktree path template
#
# Controls where new worktrees are created.
#
# **Available template variables:**
#
# - `{{ repo_path }}` — absolute path to the repository root (e.g., `/Users/me/code/myproject`. Or for bare repos, the bare directory itself)
# - `{{ repo }}` — repository directory name (e.g., `myproject`)
# - `{{ owner }}` — primary remote owner path (may include subgroups like `group/subgroup`)
# - `{{ branch }}` — raw branch name (e.g., `feature/auth`)
# - `{{ branch | sanitize }}` — filesystem-safe: `/` and `\` become `-` (e.g., `feature-auth`)
# - `{{ branch | sanitize_db }}` — database-safe: lowercase, underscores, hash suffix (e.g., `feature_auth_x7k`)
#
# **Examples** for repo at `~/code/myproject`, branch `feature/auth`:
#
# Default — sibling directory (`~/code/myproject.feature-auth`):
#
# worktree-path = "{{ repo_path }}/../{{ repo }}.{{ branch | sanitize }}"
#
# Inside the repository (`~/code/myproject/.worktrees/feature-auth`):
#
# worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"
#
# Centralized worktrees directory (`~/worktrees/myproject/feature-auth`):
#
# worktree-path = "~/worktrees/{{ repo }}/{{ branch | sanitize }}"
#
# By remote owner path (`~/development/max-sixty/myproject/feature/auth`):
#
# worktree-path = "~/development/{{ owner }}/{{ repo }}/{{ branch }}"
#
# Bare repository (`~/code/myproject/feature-auth`):
#
# worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"
#
# `~` expands to the home directory. Relative paths resolve from `repo_path`.
#
# ## LLM commit messages
#
# Generate commit messages automatically during merge. Requires an external CLI tool.
#
# ### Claude Code
#
# [commit.generation]
# command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"
#
# ### Codex
#
# [commit.generation]
# command = "codex exec -m gpt-5.1-codex-mini -c model_reasoning_effort='low' -c system_prompt='' --sandbox=read-only --json - | jq -sr '[.[] | select(.item.type? == \"agent_message\")] | last.item.text'"
#
# ### OpenCode
#
# [commit.generation]
# command = "opencode run -m anthropic/claude-haiku-4.5 --variant fast"
#
# ### llm
#
# [commit.generation]
# command = "llm -m claude-haiku-4.5"
#
# ### aichat
#
# [commit.generation]
# command = "aichat -m claude:claude-haiku-4.5"
#
# See LLM commits docs (https://worktrunk.dev/llm-commits/) for setup and Custom prompt templates (#custom-prompt-templates) for template customization.
#
# ## Command config
#
# ### List
#
# Persistent flag values for `wt list`. Override on command line as needed.
#
# [list]
# summary = false    # Enable LLM branch summaries (requires [commit.generation])
#
# full = false       # Show CI, main…± diffstat, and LLM summaries (--full)
# branches = false   # Include branches without worktrees (--branches)
# remotes = false    # Include remote-only branches (--remotes)
#
# task-timeout-ms = 0   # Kill individual git commands after N ms; 0 disables
# timeout-ms = 0        # Wall-clock budget for the entire collect phase; 0 disables
#
# ### Commit
#
# Shared by `wt step commit`, `wt step squash`, and `wt merge`.
#
# [commit]
# stage = "all"      # What to stage before commit: "all", "tracked", or "none"
#
# ### Merge
#
# Most flags are on by default. Set to false to change default behavior.
#
# [merge]
# squash = true      # Squash commits into one (--no-squash to preserve history)
# commit = true      # Commit uncommitted changes first (--no-commit to skip)
# rebase = true      # Rebase onto target before merge (--no-rebase to skip)
# remove = true      # Remove worktree after merge (--no-remove to keep)
# verify = true      # Run project hooks (--no-hooks to skip)
# ff = true          # Fast-forward merge (--no-ff to create a merge commit instead)
#
# ### Switch
#
# [switch]
# cd = true          # Change directory after switching (--no-cd to skip)
#
# [switch.picker]
# pager = "delta --paging=never"   # Example: override git's core.pager for diff preview
#
# ### Step
#
# [step.copy-ignored]
# exclude = []   # Additional excludes (e.g., [".cache/", ".turbo/"])
#
# Built-in excludes always apply: VCS metadata directories (`.bzr/`, `.hg/`, `.jj/`, `.pijul/`, `.sl/`, `.svn/`) and tool-state directories (`.conductor/`, `.entire/`, `.pi/`, `.worktrees/`). User config and project config exclusions are combined.
#
# ### Aliases
#
# Command templates that run as `wt <name>`. See the Extending Worktrunk guide (https://worktrunk.dev/extending/#aliases) for usage and flags.
#
# [aliases]
# greet = "echo Hello from {{ branch }}"
# url = "echo http://localhost:{{ branch | hash_port }}"
#
# Aliases defined here apply to all projects. For project-specific aliases, use the project config (https://worktrunk.dev/config/#project-configuration) `[aliases]` section instead.
#
# ### User project-specific settings
#
# For context:
#
# - Project config (https://worktrunk.dev/config/#project-configuration) settings are shared with teammates.
# - User configs generally apply to all projects.
# - User configs _also_ has a `[projects]` table which holds project-specific settings for the user, such as worktree layout and setting overrides. That's what this section covers.
#
# Entries are keyed by project identifier (e.g., `github.com/user/repo`). Scalar values (like `worktree-path`) replace the global value; everything else (hooks, aliases, etc.) appends, global first.
#
# [projects."github.com/user/repo"]
# worktree-path = ".worktrees/{{ branch | sanitize }}"
# list.full = true
# merge.squash = false
# pre-start.env = "cp .env.example .env"
# step.copy-ignored.exclude = [".repo-local-cache/"]
# aliases.deploy = "make deploy BRANCH={{ branch }}"
#
# ### Custom prompt templates
#
# Templates use minijinja (https://docs.rs/minijinja/) syntax.
#
# #### Commit template
#
# Available variables:
#
# - `{{ git_diff }}`, `{{ git_diff_stat }}` — diff content
# - `{{ branch }}`, `{{ repo }}` — context
# - `{{ recent_commits }}` — recent commit messages
#
# Default template:
#
# <!-- DEFAULT_TEMPLATE_START -->
# [commit.generation]
# template = """
# <task>Write a commit message for the staged changes below.</task>
#
# <format>
# - Subject line under 50 chars
# - For material changes, add a blank line then a body paragraph explaining the change
# - Output only the commit message, no quotes or code blocks
# </format>
#
# <style>
# - Imperative mood: "Add feature" not "Added feature"
# - Match recent commit style (conventional commits if used)
# - Describe the change, not the intent or benefit
# </style>
#
# <diffstat>
# {{ git_diff_stat }}
# </diffstat>
#
# <diff>
# {{ git_diff }}
# </diff>
#
# <context>
# Branch: {{ branch }}
# {% if recent_commits %}<recent_commits>
# {% for commit in recent_commits %}- {{ commit }}
# {% endfor %}</recent_commits>{% endif %}
# </context>
#
# """
# <!-- DEFAULT_TEMPLATE_END -->
#
# #### Squash template
#
# Available variables (in addition to commit template variables):
#
# - `{{ commits }}` — list of commits being squashed
# - `{{ target_branch }}` — merge target branch
#
# Default template:
#
# <!-- DEFAULT_SQUASH_TEMPLATE_START -->
# [commit.generation]
# squash-template = """
# <task>Write a commit message for the combined effect of these commits.</task>
#
# <format>
# - Subject line under 50 chars
# - For material changes, add a blank line then a body paragraph explaining the change
# - Output only the commit message, no quotes or code blocks
# </format>
#
# <style>
# - Imperative mood: "Add feature" not "Added feature"
# - Match the style of commits being squashed (conventional commits if used)
# - Describe the change, not the intent or benefit
# </style>
#
# <commits branch="{{ branch }}" target="{{ target_branch }}">
# {% for commit in commits %}- {{ commit }}
# {% endfor %}</commits>
#
# <diffstat>
# {{ git_diff_stat }}
# </diffstat>
#
# <diff>
# {{ git_diff }}
# </diff>
#
# """
# <!-- DEFAULT_SQUASH_TEMPLATE_END -->
#
# ## Hooks
#
# See `wt hook` (https://worktrunk.dev/hook/) for hook types, execution order, template variables, and examples. User hooks apply to all projects; project hooks (https://worktrunk.dev/config/#project-configuration) apply only to that repository.
