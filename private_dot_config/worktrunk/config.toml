skip-commit-generation-prompt = true

# Copy the primary worktree's gitignored .env into new worktrees (no-op if absent).
# pre-start, not post-start: post hooks run in background and race the first command.
pre-start.env = "test -f '{{ primary_worktree_path }}/.env' && cp '{{ primary_worktree_path }}/.env' '{{ worktree_path }}/.env' || true"

[aliases]
# Switch to remote branch if it exists, else create from origin/<default> (or args[1]).
newtree = "git fetch -q origin {{ args[0] }} 2>/dev/null; git fetch -q origin {{ default_branch }} || true; if git show-ref --verify --quiet refs/remotes/origin/{{ args[0] }}; then wt switch {{ args[0] }}; else wt switch --create {{ args[0] }} --base {{ args[1] | default('origin/' ~ default_branch) }}; fi"

# COMMIT — message from [commit.generation]; WT_LLM=cx|oc|co|pi swaps the backend
# (also for scp/pr/land). Editor fallback if generation fails.
sc = "wt step commit {{ args }} || git commit"

# COMMIT+PUSH — push only if the commit succeeds.
scp = "{ wt step commit {{ args }} || git commit; } && git push -u origin HEAD"

# SHIP — commit → validate → push → pr-composer → mark ready. `wt pr --draft` for a draft.
pr = "~/.local/bin/wt-pr-compose {{ args }}"

# LAND — commit → merge origin/main → push → PR (if absent) → wait CI → merge → remove worktree.
# Idempotent: safe to re-run after a partial failure; stops before merge if CI fails.
land = "{ git diff --quiet && git diff --cached --quiet || wt step commit || git commit; } && git fetch -q origin {{ default_branch }} && git merge --no-edit origin/{{ default_branch }} && git push -u origin HEAD && { gh pr view --json number >/dev/null 2>&1 || gh pr create --fill {{ args }}; } && sleep 8 && gh pr checks --watch --interval 10 && { gh merge || gh pr view --json state -q .state | grep -qx MERGED; } && { git fetch -q origin {{ default_branch }} || true; } && wt remove -D"

# DEV LOOP
up = "git fetch -q origin {{ default_branch }} && git rebase origin/{{ default_branch }}"  # rebase onto fresh origin/main
home = "wt switch ^ && (git -C {{ repo_path }} pull --ff-only -q &)"                      # main worktree, ff in background
wip = "git add -A && git commit -m wip --no-verify"                                       # undo: git reset --soft HEAD~1
rev = "wt switch pr:{{ args }}"                                                           # review PR in a worktree

[list]
summary = true  # LLM branch summaries via [commit.generation]

[commit.generation]
command = "~/.local/bin/wt-llm-commit"
# Conventional Commits drive the PR title prefix the GitHub auto-labeler reads.
template-append = """
- Use Conventional Commits: <type>(<optional scope>): <subject>
- type is one of: feat, fix, docs, chore, refactor, perf, test, ci, build, style
- subject: imperative mood, lower-case, no trailing period, <= 60 chars
"""

# ai-framework-mono pins python 3.14.3 but mise's UV_PYTHON is latest; mise.local.toml
# is globally gitignored, so each new worktree needs its own.
[projects."github.com/blackwoodseven/ai-framework-mono"]
pre-start.mise = "mise use --env local python@3.14.3"
